# Dataset-specific optimization settings from the manuscript supplement.
data:
  name: sports
  format: amazon
  reviews: data/raw/sports/reviews_Sports_and_Outdoors_5.json.gz
  metadata: data/raw/sports/meta_Sports_and_Outdoors.json.gz
index:
  unfreeze_epoch: 400
  conditional_dropout: 0.1
  alignment:
    temperature: 0.08
    weight: 0.001
    start: 400
    warmup: 400
    view_dropout: 0.1
    view_noise: 0.01
model:
  guidance:
    bias: 0.8
train:
  lr: 0.002
