# Shared main-method settings; dataset overlays follow the manuscript supplement.
runtime:
  seed: 2025
  device: auto
  threads: 4
  output: runs
  run_id: default
data:
  name: beauty
  format: amazon
  reviews: ''
  metadata: ''
  core: 5
  history_length: 20
  train_sampling: all_prefixes
features:
  model: sentence-transformers/sentence-t5-base
  revision: null
  batch_size: 128
  normalize: false
din:
  dim: 96
  epochs: 10
  batch_size: 128
  lr: 0.001
  weight_decay: 1.0e-05
  negatives: 32
  dropout: 0.1
index:
  dim: 96
  sizes:
  - 256
  - 256
  - 512
  - 512
  eta:
  - 0.25
  - 0.2
  - 0.2
  - 0.15
  encoder_dropout: 0.15
  conditional_dropout: 0.1
  semantic_conditional_dropout: 0.1
  semantic_conditioning: true
  conditional_quantization: true
  conditional_reconstruction: true
  stage1_epochs: 2000
  stage2_epochs: 2000
  unfreeze_epoch: 600
  batch_size: 1024
  lr: 0.0005
  codebook_lr: 0.0001
  weight_decay: 1.0e-05
  kmeans_iters: 10
  kmeans_max_items: 50000
  pgq:
    enabled: true
    topk: 24
    warmup_steps: 200
    refresh_steps: 250
    decay: 0.99
    gamma: 0.35
    global_fraction: 0.35
    parent_adapt: 0.4
    reserve: 2
  alignment:
    weight: 0.0012
    temperature: 0.07
    start: 0
    warmup: 100
    view_dropout: 0.1
    view_noise: 0.01
  sem2beh:
    enabled: true
    weight: 0.003
    start: 50
    warmup: 150
    detach_source: true
model:
  dim: 128
  ff_dim: 1024
  heads: 6
  head_dim: 64
  encoder_layers: 4
  decoder_layers: 4
  dropout: 0.1
  shc:
    enabled: true
    dropout: 0.1
    temperature: 1.0
    learnable_scale: false
    scale_init: 1.0
  guidance:
    enabled: true
    bias: 0.8
    start: 50
    warmup: 100
train:
  epochs: 200
  batch_size: 128
  eval_batch_size: 32
  accumulation: 2
  lr: 0.001
  weight_decay: 0.1
  warmup_steps: 10000
  patience: 20
  max_grad_norm: 1.0
evaluation:
  beam: 50
  topk:
  - 5
  - 10
  selection_metric: ndcg@10
